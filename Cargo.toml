[package]
name = "misb"
version = "0.2.0"
edition = "2021"
# The library; the optional serde feature needs 1.71, the rust-version of
# serde_derive and the proc-macro crates it pulls in.
rust-version = "1.70"
description = "MISB ST 0601 UAS Datalink Local Set decoder, with the sets ST 0601 embeds and a C API"
repository = "https://github.com/notley-technologies/misb-rs"
readme = "README.md"
keywords = ["misb", "klv", "st0601", "uas", "metadata"]
categories = ["multimedia::video", "parser-implementations", "aerospace::unmanned-aerial-vehicles"]
license = "Apache-2.0"
# The smpte-klv package on crates.io is a different implementation.
publish = false
exclude = ["/*.ts", "/*.klv", "/target", "/fuzz"]

[lib]
# rlib for Rust users; cdylib and staticlib for the C ABI (include/misb.h).
# As in mpegts, so a Rust project that depends on misb builds the two C
# libraries too (see README, "Building").
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["capi"]
## Export the C ABI (decoder and encoder; implies `encode`, so the C
## library is one artifact). Rust consumers can disable default features
## to compile with unsafe code forbidden.
capi = ["encode", "mpegts?/capi"]
## `serde::Serialize` for the decoded types, errors and statistics, and
## `Serialize` and `Deserialize` for `Config`.
serde = ["dep:serde"]
## The encoder (`misb::encode`): ST 0601 packets and the ST 0102 and ST 0903
## sets they embed. No extra dependencies.
encode = []
## The NDJSON authoring format for the encoder (`misb::json`). Adds
## serde_json.
json = ["encode", "serde", "dep:serde_json"]
## Inserting KLV into transport streams (`misb::mux`): the scheduler that
## maps MISP time to PTS and feeds the `mpegts` injector. Adds mpegts (with
## its `mux` feature), re-exported as `misb::mpegts`. With `capi` too, the C
## library also exports the mpegts C API, so a C program links one library.
mux = ["encode", "dep:mpegts", "mpegts?/mux"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
smpte-klv = { git = "https://github.com/notley-technologies/smpte-klv-rs", rev = "bc5346dd298fa061d6838f5b90ffbb952019dcd7" }
# Pinned by rev like smpte-klv; move it together with any other user of
# mpegts so Cargo builds one copy (MUXING_PLAN.md section 3).
mpegts = { git = "https://github.com/notley-technologies/mpegts-rs", rev = "79861e330b35d92637818d598b894ea2dfd7215d", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "c_abi"
required-features = ["capi"]

[[test]]
name = "c_install"
required-features = ["capi"]

[[example]]
name = "klvdump"

[[example]]
name = "json"
required-features = ["serde"]

[[example]]
name = "throughput"

[[example]]
name = "klvencode"
required-features = ["json"]

[[test]]
name = "encode_st0601"
required-features = ["encode"]

[[test]]
name = "json"
required-features = ["json"]

[[test]]
name = "state"
required-features = ["encode"]

[[test]]
name = "track"
required-features = ["encode"]

[[test]]
name = "mux_schedule"
required-features = ["mux"]

[[test]]
name = "mux_file"
required-features = ["mux"]

[[test]]
name = "mux_video"
required-features = ["mux"]

[[test]]
name = "mux_live"
required-features = ["mux"]

[package.metadata.docs.rs]
all-features = true

# Applies when this crate is built on its own (C library, examples), not
# when it is a dependency.
[profile.release]
lto = true
codegen-units = 1
